name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-cpu.lock
          python -c 'import pyarrow; print(pyarrow.__version__)'
      - name: Lint and format check
        run: |
          make PYTHON=python lint
      - name: Type check
        run: make PYTHON=python typecheck
      - name: Offline CPU tests
        run: make PYTHON=python test
