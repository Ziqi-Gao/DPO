defaults:
  - model: tiny_qwen
  - teacher: tiny_teacher
  - task: a_implies_b
  - state_source: fixed_bank
  - supervision: hard_teacher
  - circuit: eap_ig
  - anti_shortcut: proofgraph
  - experiment: offline_hard

seed: 42
output_root: outputs
prereg_path: prereg/core_v2.yaml
prereg_version: core_v2
trainer:
  max_steps: 2
  steps_per_round: 1
  batch_size: 4
  learning_rate: 0.0005
  weight_decay: 0.0
  checkpoint_every: 1
  evaluation_every: 1
  backend: torch_smoke
  gradient_accumulation_steps: 1
  max_completion_length: 128
  token_budget: 1024
logging:
  wandb_enabled: false
production_safety:
  max_smoke_steps: 100
  max_smoke_tokens: 1000000
  require_anti_shortcut_gate: true
  require_frozen_probe_cohorts: true
  probe_cohort_manifest: outputs/probes/proofgraph/manifest.json
  readiness_report: outputs/readiness/readiness.json
label_leakage:
  maximum_query_only_accuracy: 0.55
  maximum_surface_feature_accuracy: 0.55
  maximum_bow_accuracy: 0.60
teacher_readiness:
  minimum_teacher_answer_accuracy: 0.90
  minimum_teacher_exact_proof_accuracy: 0.85
  minimum_teacher_first_rule_top1_accuracy: 0.80
  minimum_teacher_intermediate_top1_accuracy: 0.80
  minimum_teacher_topk_mass: 0.90
  minimum_teacher_topk_target_coverage: 0.90
  minimum_corrupted_prefix_recovery_accuracy: 0.70
  minimum_causal_shift_logprob: 0.0
