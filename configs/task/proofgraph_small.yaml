name: proofgraph
num_examples: 1000
seed: 42
depth_range: [2, 4]
distractor_range: [2, 8]
structures: [chain, branch, converging_dag]
ood_depth_range: [5, 7]
unique_proof_for_circuits: true
multiple_valid_proof_fraction: 0.5
split_sizes:
  train: 1000
  validation: 200
  iid_test: 200
  ood_depth_test: 200
  ood_structure_test: 200
  circuit_discovery: 100
  circuit_validation: 100
balanced_labels: true

