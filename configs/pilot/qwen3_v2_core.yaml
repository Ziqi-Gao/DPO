groups:
  model: qwen3_v2_1p7b
  teacher: qwen3_v2_teacher_8b
  task: proofgraph_main
overrides:
  output_root: outputs/qwen3-v2
  protocol_track: qwen3_v2
  prereg_path: prereg/qwen3_v2.yaml
  prereg_version: qwen3_v2
  seed: 42
  trainer:
    backend: accelerate
    max_steps: 120
    token_budget: 2000000
    token_budget_unit: global_nonpadding_model_input_tokens
    batch_size: 4
    gradient_accumulation_steps: 4
    checkpoint_every: 20
    evaluation_every: 20
    validation_examples: 128
  resource_budget:
    node_memory_gib: 192
    minimum_headroom_gib: 32
    minimum_headroom_fraction: 0.20
    loading_strategy: low_cpu_mem_student_rank_zero_teacher
  state_source:
    store_path: outputs/qwen3-v2/rollout_banks/common_mu
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
  supervision:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
  task:
    num_examples: 4096
    validation_split_path: outputs/qwen3-v2/datasets/proofgraph-validation
  anti_shortcut:
    report_path: outputs/qwen3-v2/g0/anti_shortcut.json
  circuit:
    discovery_pair_count: 8
    validation_pair_count: 8
    mib_bootstrap_replicates: 5
    prompt_bootstrap_samples: 200
  production_safety:
    readiness_report: outputs/qwen3-v2/readiness/readiness.json
    probe_cohort_manifest: outputs/qwen3-v2/probes/proofgraph/manifest.json
profile_kind: single_seed_qwen3_v2_full_pipeline_feasibility
claim_scope: full_mechanism_pipeline_feasibility_only_not_confirmatory_primary_endpoint
protocol_track: qwen3_v2
artifact_namespace: qwen3-v2
full_parameter_training: true
seeds: [42]
factorial_cells:
  - offline_hard
  - online_hard
  - offline_soft
  - online_soft_opd
  - offline_verified_replay
  - online_verified_replay
anchors: [canonical_sft, canonical_grpo]
pilot_circuit_scope:
  cells:
    - offline_hard
    - online_hard
    - offline_soft
    - online_soft_opd
    - offline_verified_replay
    - online_verified_replay
    - canonical_sft
    - canonical_grpo
  cohorts: [base_capable, challenge]
  stages:
    - {label: process, probe_stage: first_rule_selection}
    - {label: final_answer, probe_stage: final_answer}
