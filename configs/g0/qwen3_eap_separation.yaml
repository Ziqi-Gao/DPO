groups:
  model: qwen3_1p7b
  teacher: qwen3_teacher_8b
  task: proofgraph_main
overrides:
  output_root: /data/del6500/OPD/outputs/qwen3-v1
  protocol_track: qwen3_v1
  prereg_path: prereg/qwen3_v1.yaml
  prereg_version: qwen3_v1
  trainer:
    backend: accelerate
    max_steps: 120
    token_budget: 2000000
    token_budget_unit: global_nonpadding_model_input_tokens_processed
    batch_size: 4
    gradient_accumulation_steps: 4
    checkpoint_every: 20
    evaluation_every: 20
    validation_examples: 128
  task:
    dataset_family_path: /data/del6500/OPD/outputs/qwen3-v1/datasets/proofgraph
  anti_shortcut:
    report_path: /data/del6500/OPD/outputs/qwen3-v1/g0/anti_shortcut.json
    num_examples: 128
  state_source:
    store_path: /data/del6500/OPD/outputs/qwen3-v1/rollout_banks/common_mu
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
  production_safety:
    readiness_report: /data/del6500/OPD/outputs/qwen3-v1/readiness/readiness.json
    probe_cohort_manifest: /data/del6500/OPD/outputs/qwen3-v1/probes/proofgraph/manifest.json
  circuit:
    discovery_pair_count: 8
    validation_pair_count: 8
    mib_bootstrap_replicates: 5
    prompt_bootstrap_samples: 200
profile_kind: qwen3_production_stack_gate
protocol_track: qwen3_v1
artifact_namespace: qwen3-v1
full_parameter_training: false
seed: 42
parity_tolerance: 0.02
minimum_bootstrap_spearman: 0.50
minimum_random_control_margin: 0.0
minimum_attribution_exact_spearman: 0.20
minimum_spearman_bootstrap_lower_bound: -0.05
minimum_selected_vs_random_cpr_margin: 0.0
require_identity_sanity: true
require_full_corruption_sanity: true
require_qwen3_qk_norm_semantics: true
probe_candidates_per_split: 128
base_accuracy_examples: 128
