groups:
  model: qwen3_v2_1p7b
  teacher: qwen3_v2_teacher_8b
  task: proofgraph_main
overrides:
  output_root: outputs/qwen3-v2
  protocol_track: qwen3_v2
  prereg_path: prereg/qwen3_v2.yaml
  prereg_version: qwen3_v2
  trainer:
    backend: accelerate
    max_steps: 120
    token_budget: 2000000
    token_budget_unit: global_nonpadding_model_input_tokens
    batch_size: 4
    gradient_accumulation_steps: 4
    checkpoint_every: 20
    evaluation_every: 20
    validation_examples: 128
  task:
    validation_split_path: outputs/qwen3-v2/datasets/proofgraph-validation
  anti_shortcut:
    report_path: outputs/qwen3-v2/g0/anti_shortcut.json
    num_examples: 128
  state_source:
    store_path: outputs/qwen3-v2/rollout_banks/common_mu
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
  resource_budget:
    node_memory_gib: 192
    minimum_headroom_gib: 32
    minimum_headroom_fraction: 0.20
    loading_strategy: low_cpu_mem_student_rank_zero_teacher
  production_safety:
    readiness_report: outputs/qwen3-v2/readiness/readiness.json
    probe_cohort_manifest: outputs/qwen3-v2/probes/proofgraph/manifest.json
  circuit:
    discovery_pair_count: 8
    validation_pair_count: 8
    mib_bootstrap_replicates: 5
    prompt_bootstrap_samples: 200
profile_kind: qwen3_v2_production_stack_gate
protocol_track: qwen3_v2
artifact_namespace: qwen3-v2
full_parameter_training: false
seed: 42
parity_tolerance: 0.02
minimum_bootstrap_spearman: 0.50
minimum_random_control_margin: 0.0
minimum_attribution_exact_spearman: 0.20
minimum_spearman_bootstrap_lower_bound: -0.05
minimum_selected_vs_random_cpr_margin: 0.0
require_identity_sanity: true
require_full_corruption_sanity: true
require_qwen3_qk_norm_semantics: true
probe_candidates_per_split: 128
base_accuracy_examples: 128
